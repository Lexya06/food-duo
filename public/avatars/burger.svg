<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <clipPath id="clip_bg">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg_bg)"/>
  <g clip-path="url(#clip_bg)" transform="translate(50, 52) scale(1.18) translate(-50, -50)">
    <!-- Top Bun -->
    <path d="M 28 50 C 28 36 72 36 72 50 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <!-- Sesame seeds -->
    <ellipse cx="42" cy="42" rx="1.5" ry="0.8" fill="#fef08a" transform="rotate(-15 42 42)"/>
    <ellipse cx="50" cy="40" rx="1.5" ry="0.8" fill="#fef08a"/>
    <ellipse cx="58" cy="42" rx="1.5" ry="0.8" fill="#fef08a" transform="rotate(15 58 42)"/>
    <!-- Lettuce (wavy) -->
    <path d="M 26 50 Q 32 54 38 50 Q 44 54 50 50 Q 56 54 62 50 Q 68 54 74 50 L 74 53 Q 68 57 62 53 Q 56 57 50 53 Q 44 57 38 53 Q 32 57 26 53 Z" fill="#22c55e"/>
    <!-- Cheese -->
    <polygon points="28,54 72,54 68,60 50,64 32,60" fill="#facc15"/>
    <!-- Patty -->
    <rect x="27" y="58" width="46" height="8" rx="4" fill="#78350f"/>
    <!-- Bottom Bun -->
    <path d="M 30 68 C 30 75 70 75 70 68 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <!-- Face on top bun -->
    <circle cx="44" cy="47" r="1.8" fill="#1e293b"/>
    <circle cx="56" cy="47" r="1.8" fill="#1e293b"/>
    <path d="M 48 48 Q 50 50 52 48" stroke="#1e293b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Chef Hat -->
    <ellipse cx="50" cy="29" rx="12" ry="3.5" fill="#f1f5f9"/>
    <path d="M 38 29 C 38 29 36 16 41 13 C 45 10 55 10 59 13 C 64 16 62 29 62 29 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="43" cy="14" r="6" fill="#ffffff"/>
    <circle cx="50" cy="11" r="7" fill="#ffffff"/>
    <circle cx="57" cy="14" r="6" fill="#ffffff"/>
    <rect x="39" y="25" width="22" height="4" rx="1.5" fill="#e2e8f0"/>
  </g>
</svg>
