<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg_pd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="clip_pd">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg_pd)"/>
  <g clip-path="url(#clip_pd)" transform="translate(50, 52) scale(1.18) translate(-50, -50)">
    <!-- Panda Ears -->
    <circle cx="28" cy="38" r="9" fill="#1e293b"/>
    <circle cx="72" cy="38" r="9" fill="#1e293b"/>
    <!-- Panda Body -->
    <path d="M 28 88 C 28 72 36 68 50 68 C 64 68 72 72 72 88 Z" fill="#ffffff"/>
    <circle cx="36" cy="78" r="7" fill="#1e293b"/>
    <circle cx="64" cy="78" r="7" fill="#1e293b"/>
    <!-- Head -->
    <ellipse cx="50" cy="54" rx="22" ry="18" fill="#ffffff"/>
    <!-- Eye Patches -->
    <ellipse cx="39" cy="52" rx="6" ry="8" fill="#1e293b" transform="rotate(-15 39 52)"/>
    <ellipse cx="61" cy="52" rx="6" ry="8" fill="#1e293b" transform="rotate(15 61 52)"/>
    <!-- Eyes -->
    <circle cx="40" cy="51" r="2.2" fill="#ffffff"/>
    <circle cx="41" cy="51" r="1.2" fill="#0f172a"/>
    <circle cx="60" cy="51" r="2.2" fill="#ffffff"/>
    <circle cx="59" cy="51" r="1.2" fill="#0f172a"/>
    <!-- Nose & Mouth -->
    <ellipse cx="50" cy="59" rx="3.5" ry="2.2" fill="#1e293b"/>
    <path d="M 47 62 Q 50 65 53 62" stroke="#1e293b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Chef Hat -->
    <ellipse cx="50" cy="34" rx="12" ry="3.5" fill="#f1f5f9"/>
    <path d="M 38 34 C 38 34 36 21 41 18 C 45 15 55 15 59 18 C 64 21 62 34 62 34 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="43" cy="19" r="6" fill="#ffffff"/>
    <circle cx="50" cy="16" r="7" fill="#ffffff"/>
    <circle cx="57" cy="19" r="6" fill="#ffffff"/>
    <rect x="39" y="30" width="22" height="4" rx="1.5" fill="#e2e8f0"/>
  </g>
</svg>
